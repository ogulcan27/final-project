# E2E run: docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from playwright
# The app service must not be named "app": Chromium HSTS-preloads the .app TLD and forces HTTPS.
# Then clean up the throwaway database: docker compose -f test/docker-compose.test.yml down -v
services:
  finally:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      LLM_MOCK: "true"
      MASSIVE_API_KEY: ""
      FINALLY_DB_PATH: /app/db/finally.db
    volumes:
      - e2e-db:/app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /e2e
    environment:
      BASE_URL: http://finally:8000
      CI: "true"
    volumes:
      - .:/e2e
      - /e2e/node_modules
    command: ["sh", "-c", "npm ci && npx playwright test"]
    depends_on:
      finally:
        condition: service_healthy

volumes:
  e2e-db:
